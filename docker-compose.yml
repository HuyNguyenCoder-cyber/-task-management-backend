services:
  mysql:
    image: mysql:8.4
    container_name: task-management-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: task_management
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - task_network

  redis:
    image: redis:7-alpine
    container_name: task-management-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - task_network

  api:
    build: .
    container_name: task-management-api
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - task_network

  worker:
    build: .
    container_name: task-management-worker
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - mysql
      - redis
    networks:
      - task_network

networks:
  task_network:
    driver: bridge

volumes:
  mysql_data:
