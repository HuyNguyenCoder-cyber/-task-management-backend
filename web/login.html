<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Task Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
  <nav class="navbar">
    <a class="logo" href="home.html">Task Management</a>
    <a class="nav-link" href="tasks.html">Tasks</a>
    <a class="nav-link" href="projects.html">Projects</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link" data-auth="out" href="login.html">Login</a>
    <a class="nav-link" data-auth="out" href="register.html">Register</a>
    <button class="nav-button" data-auth="in" id="logout">Logout</button>
  </nav>
  <main class="container">
    <section class="panel">
      <h1>Login</h1>
      <form id="login-form">
        <label>Email
          <input name="email" type="email" required>
        </label>
        <label>Password
          <input name="password" type="password" required>
        </label>
        <button type="submit">Login</button>
      </form>
      <div id="status" class="status" hidden></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
