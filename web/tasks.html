<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tasks - Task Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="tasks">
  <nav class="navbar">
    <a class="logo" href="home.html">Task Management</a>
    <a class="nav-link" href="tasks.html">Tasks</a>
    <a class="nav-link" href="projects.html">Projects</a>
    <a class="nav-link" href="profile.html">Profile</a>
    <a class="nav-link" data-auth="out" href="login.html">Login</a>
    <a class="nav-link" data-auth="out" href="register.html">Register</a>
    <button class="nav-button" data-auth="in" id="logout">Logout</button>
  </nav>
  <main class="container">
    <div class="page-header">
      <div>
        <h1>Tasks</h1>
        <p class="muted">Create, update, delete, and open task details.</p>
      </div>
    </div>
    <div id="status" class="status" hidden></div>
    <div class="grid">
      <section class="panel">
        <h2>Task form</h2>
        <form id="task-form">
          <input type="hidden" name="id">
          <div class="row">
            <label>Project
              <select name="project_id" id="task-project-select">
                <option value="">No project</option>
              </select>
            </label>
            <label>Status
              <select name="status" required>
                <option value="todo">todo</option>
                <option value="in_progress">in_progress</option>
                <option value="done">done</option>
              </select>
            </label>
          </div>
          <label>Title
            <input name="title" required>
          </label>
          <label>Description
            <textarea name="description"></textarea>
          </label>
          <label>Due date
            <input name="due_date" type="datetime-local">
          </label>
          <label>Assignee
            <input name="assignee_display" disabled>
          </label>
          <div class="actions">
            <button type="submit">Save task</button>
            <button class="secondary" id="clear-task-form" type="button">Clear</button>
          </div>
        </form>
      </section>
      <section>
        <h2>Task list</h2>
        <div id="task-list"></div>
      </section>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
